name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # A floating "1.26" (not go-version-file, which pins the exact
          # go.mod directive 1.26.0) so CI always gets the latest 1.26.x
          # patch release — govulncheck flags stdlib CVEs fixed in later
          # 1.26.x point releases that 1.26.0 itself still carries. go.mod's
          # directive stays at 1.26.0 so pilab keeps building with its
          # locally installed go1.26.5 instead of downloading a newer
          # toolchain on every rebuild.
          go-version: "1.26"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Check module files
        run: |
          go mod verify
          go mod tidy -diff
      - name: Validate config and asset syntax
        run: |
          bash -n scripts/*.sh
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          for path in pathlib.Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in pathlib.Path('.').rglob('*.svg'):
              if ET.parse(path).getroot().tag.rsplit('}', 1)[-1] != 'svg':
                  raise SystemExit(f'{path}: root element is not svg')
          PY
      - name: Static analysis
        run: |
          go vet ./...
          go tool staticcheck ./...
          go tool govulncheck ./...
      - name: Tests with race detector
        run: go test -race -shuffle=on ./...
      - name: Enforce coverage floor
        run: |
          go test -coverprofile=/tmp/coverage.out ./...
          go tool cover -func=/tmp/coverage.out
          coverage=$(go tool cover -func=/tmp/coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) exit 1 }'
      - name: Cross-build Raspberry Pi 4 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o /tmp/llm-status-linux-arm64 ./cmd/llm-status
      - name: Verify release packaging and checksums
        run: |
          bash scripts/package.sh ci
          cd dist
          sha256sum --check SHA256SUMS
